<svg viewBox="0 0 680 360" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>简历状态流转图</title>
<desc>简历从在库状态，经推送、选中、退出等状态流转，保持简历库活性</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="250" y="36" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="58" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">在库（可匹配）</text>
<text x="340" y="78" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">新解析入库的默认状态</text>

<rect x="250" y="150" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="172" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">已推送</text>
<text x="340" y="192" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">定向推送给某单位</text>

<rect x="60" y="262" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="150" y="284" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="16">被选中</text>
<text x="150" y="303" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">单位确认有意向</text>

<rect x="440" y="262" width="180" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="284" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">未选中</text>
<text x="530" y="303" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">回退，可再匹配他岗</text>

<rect x="250" y="262" width="180" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="284" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">已退出</text>
<text x="340" y="303" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">已不找工作，不再匹配</text>

<line x1="340" y1="92" x2="340" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="122" font-size="11" fill="#5F5E5A">HR 定向推送</text>

<line x1="300" y1="206" x2="160" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180" y="228" font-size="11" fill="#5F5E5A">单位反馈选中</text>

<line x1="380" y1="206" x2="510" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430" y="228" font-size="11" fill="#5F5E5A">未被选中</text>

<line x1="340" y1="206" x2="340" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="240" font-size="11" fill="#5F5E5A">确认已退出</text>

<path d="M150 318 L150 340 L340 340 L340 318" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="245" y="336" font-size="11" fill="#0F6E56">未选中回退在库，可再匹配其他岗位</text>
</svg>
