services:
  db:
    image: pgvector/pgvector:pg16
    container_name: talent-graph-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talent_graph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: talent-graph-backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/talent_graph
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # 如需本地 BGE-M3 / PaddleOCR 用 GPU，取消下面注释（需 NVIDIA Container Toolkit）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  frontend:
    build: ./frontend
    container_name: talent-graph-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  upload_data:
